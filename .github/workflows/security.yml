---
name: Security

# Dependency audit. This repo's own Python is stdlib-only
# (scripts/check_readme.py imports nothing outside the standard library), but
# ci.yml installs `check-jsonschema` inline in a `pip install` line. A package
# pinned inside a workflow's shell command is invisible to Dependabot, so until
# now nothing audited it OR updated it.
#
# This is the Python counterpart to the `cargo audit` / `cargo vet` gates in
# the Rust MCP repos. pip-audit queries the Python Packaging Advisory Database
# (PyPA) plus OSV.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisories are published against versions already pinned, so a clean PR
    # run goes stale. Re-check daily against a fresh database.
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip-audit:
    name: pip-audit (CI tool pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pinned: an unpinned audit tool is itself an unreviewed dependency, and
      # a silent major bump would change what this gate means.
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # pip-audit reads a requirements file or a project path, never bare specs
      # on the command line, so materialise the inline pins.
      # Keep this list in step with ci.yml's `pip install` line.
      - name: Audit the CI tool pins
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ci-tools.txt" <<'EOF'
          check-jsonschema==0.38.2
          EOF
          pip-audit --strict --requirement "$RUNNER_TEMP/ci-tools.txt"
